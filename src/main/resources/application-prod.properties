# Production Profile - MySQL Database Configuration

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/college_db?createDatabaseIfNotExist=true
spring.datasource.username=collegeapp
spring.datasource.password=space112
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# H2 Console (Disabled in Production)
spring.h2.console.enabled=false

# Logging
logging.level.org.hibernate.SQL=WARN
