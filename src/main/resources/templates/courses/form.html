<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/navbar :: head}">
    <title>Course Form</title>
</head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar(activePage='courses')}"></nav>

    <div th:replace="~{fragments/navbar :: alerts}"></div>

    <div class="container mt-4">
        <h2><i class="bi bi-book-half"></i> Course Form</h2>

        <div class="card mt-3">
            <div class="card-body">
                <form th:action="@{/courses}" th:object="${course}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Course Code <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{code}"
                            th:classappend="${#fields.hasErrors('code')} ? 'is-invalid' : ''" placeholder="e.g., CS101"
                            required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Course Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{name}"
                            th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                            placeholder="e.g., Introduction to Programming" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Credits <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" th:field="*{credits}"
                            th:classappend="${#fields.hasErrors('credits')} ? 'is-invalid' : ''" min="1" max="10"
                            placeholder="e.g., 3" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('credits')}" th:errors="*{credits}">
                        </div>
                        <small class="form-text text-muted">Credits must be between 1 and 10</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <select class="form-select" th:field="*{department}">
                            <option value="">-- Select Department --</option>
                            <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}">
                            </option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Save
                        </button>
                        <a href="/courses" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
</body>

</html>
