<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/navbar :: head}">
    <title>Courses</title>
</head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar(activePage='courses')}"></nav>

    <div th:replace="~{fragments/navbar :: alerts}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="bi bi-book-fill"></i> Courses</h2>
            <a href="/courses/new" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Add Course
            </a>
        </div>

        <div th:if="${courses.isEmpty()}" class="alert alert-info">
            <i class="bi bi-info-circle"></i> No courses found. Click "Add Course" to create one.
        </div>

        <table th:unless="${courses.isEmpty()}" class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Credits</th>
                    <th>Department</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="course : ${courses}">
                    <td th:text="${course.id}"></td>
                    <td><strong th:text="${course.code}"></strong></td>
                    <td th:text="${course.name}"></td>
                    <td th:text="${course.credits}"></td>
                    <td th:text="${course.department != null ? course.department.name : 'N/A'}"></td>
                    <td>
                        <a th:href="@{/courses/edit/{id}(id=${course.id})}" class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <form th:action="@{/courses/delete/{id}(id=${course.id})}" method="post"
                            style="display: inline;"
                            onsubmit="return confirmDelete('Are you sure you want to delete this course?');">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
</body>

</html>
