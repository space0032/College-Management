<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/navbar :: head}">
    <title>Department Form</title>
</head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar(activePage='departments')}"></nav>

    <div th:replace="~{fragments/navbar :: alerts}"></div>

    <div class="container mt-4">
        <h2><i class="bi bi-building-add"></i> Department Form</h2>

        <div class="card mt-3">
            <div class="card-body">
                <form th:action="@{/departments}" th:object="${department}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Department Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{name}"
                            th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                            placeholder="e.g., Computer Science" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" th:field="*{description}"
                            th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''" rows="3"
                            placeholder="Enter department description"></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}"
                            th:errors="*{description}"></div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Save
                        </button>
                        <a href="/departments" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
</body>

</html>
