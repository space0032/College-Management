<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/navbar :: head}">
    <title>Departments</title>
</head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar(activePage='departments')}"></nav>

    <div th:replace="~{fragments/navbar :: alerts}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="bi bi-building-fill"></i> Departments</h2>
            <a href="/departments/new" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Add Department
            </a>
        </div>

        <div th:if="${departments.isEmpty()}" class="alert alert-info">
            <i class="bi bi-info-circle"></i> No departments found. Click "Add Department" to create one.
        </div>

        <table th:unless="${departments.isEmpty()}" class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Students</th>
                    <th>Courses</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="department : ${departments}">
                    <td th:text="${department.id}"></td>
                    <td th:text="${department.name}"></td>
                    <td th:text="${department.description ?: 'N/A'}"></td>
                    <td th:text="${department.students.size()}"></td>
                    <td th:text="${department.courses.size()}"></td>
                    <td>
                        <a th:href="@{/departments/edit/{id}(id=${department.id})}" class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <form th:action="@{/departments/delete/{id}(id=${department.id})}" method="post"
                            style="display: inline;"
                            onsubmit="return confirmDelete('Are you sure you want to delete this department? This will also remove associated students and courses.');">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
</body>

</html>
