<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${hostel.id != null ? 'Edit Hostel' : 'Add Hostel'}">Hostel Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-building"></i>
                            <span th:text="${hostel.id != null ? 'Edit Hostel' : 'Add New Hostel'}"></span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                        <form th:action="${hostel.id != null ? '/hostels/' + hostel.id : '/hostels'}"
                            th:object="${hostel}" method="post">

                            <div class="mb-3">
                                <label for="name" class="form-label">Hostel Name <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{name}" id="name"
                                    placeholder="e.g., Boys Hostel 1" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="capacity" class="form-label">Capacity <span
                                        class="text-danger">*</span></label>
                                <input type="number" class="form-control" th:field="*{capacity}" id="capacity"
                                    placeholder="e.g., 200" min="1" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('capacity')}"
                                    th:errors="*{capacity}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">Address <span
                                        class="text-danger">*</span></label>
                                <textarea class="form-control" th:field="*{address}" id="address" rows="3"
                                    placeholder="Enter full address" required></textarea>
                                <div class="text-danger" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="warden" class="form-label">Assign Warden (Optional)</label>
                                <select class="form-select" th:field="*{warden}" id="warden">
                                    <option value="">-- Select Warden --</option>
                                    <option th:each="w : ${wardens}" th:value="${w.id}"
                                        th:text="${w.fullName + ' (' + w.username + ')'}">
                                    </option>
                                </select>
                                <small class="text-muted">Select a user with Warden role to manage this hostel</small>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="/hostels" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i>
                                    <span th:text="${hostel.id != null ? 'Update' : 'Save'}"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
