<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostels - College Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div th:replace="~{fragments/navbar :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="bi bi-building"></i> Hostel Management</h2>
            <a href="/hostels/new" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Add New Hostel
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${hostels.empty}" class="text-center py-5">
                    <i class="bi bi-building" style="font-size: 4rem; color: #ccc;"></i>
                    <p class="text-muted mt-3">No hostels found. Add your first hostel to get started.</p>
                    <a href="/hostels/new" class="btn btn-primary">Add Hostel</a>
                </div>

                <div th:unless="${hostels.empty}" class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Capacity</th>
                                <th>Address</th>
                                <th>Warden</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="hostel : ${hostels}">
                                <td><strong th:text="${hostel.name}"></strong></td>
                                <td th:text="${hostel.capacity}"></td>
                                <td th:text="${hostel.address}"></td>
                                <td>
                                    <span th:if="${hostel.warden != null}" th:text="${hostel.warden.fullName}"></span>
                                    <span th:unless="${hostel.warden != null}" class="text-muted">Not Assigned</span>
                                </td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/hostels/{id}/edit(id=${hostel.id})}"
                                            class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-pencil"></i> Edit
                                        </a>
                                        <form th:action="@{/hostels/{id}/delete(id=${hostel.id})}" method="post"
                                            style="display:inline;"
                                            onsubmit="return confirm('Are you sure you want to delete this hostel?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                                <i class="bi bi-trash"></i> Delete
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
