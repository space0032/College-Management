<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Final Approval</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/section/dashboard"><i class="bi bi-shield-fill-check"></i> Student
                Section</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0"><i class="bi bi-file-earmark-check"></i> Final Approval Review</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info"><i class="bi bi-check-circle"></i> This application has been
                            approved by the Warden</div>

                        <dl class="row">
                            <dt class="col-sm-4">Application Number:</dt>
                            <dd class="col-sm-8"><strong th:text="${gatePass.applicationNumber}"></strong></dd>

                            <dt class="col-sm-4">Student:</dt>
                            <dd class="col-sm-8"
                                th:text="${gatePass.student.firstName + ' ' + gatePass.student.lastName}"></dd>

                            <dt class="col-sm-4">Purpose:</dt>
                            <dd class="col-sm-8" th:text="${gatePass.purpose}"></dd>

                            <dt class="col-sm-4">Destination:</dt>
                            <dd class="col-sm-8" th:text="${gatePass.destination}"></dd>

                            <dt class="col-sm-4">Warden Approval:</dt>
                            <dd class="col-sm-8">
                                <span class="badge bg-success">Approved</span><br>
                                <small
                                    th:text="${#temporals.format(gatePass.wardenApprovalDate, 'dd-MMM-yyyy HH:mm')}"></small><br>
                                <small class="text-muted" th:text="'Remarks: ' + ${gatePass.wardenRemarks}"></small>
                            </dd>
                        </dl>

                        <hr>

                        <div class="row">
                            <div class="col-md-6">
                                <form th:action="@{/section/gatepass/{id}/approve(id=${gatePass.id})}" method="post">
                                    <label class="form-label">Final Remarks (Optional):</label>
                                    <textarea class="form-control mb-2" name="remarks" rows="2"></textarea>
                                    <button type="submit" class="btn btn-success w-100">
                                        <i class="bi bi-check-circle"></i> Final Approve
                                    </button>
                                </form>
                            </div>
                            <div class="col-md-6">
                                <form th:action="@{/section/gatepass/{id}/reject(id=${gatePass.id})}" method="post">
                                    <label class="form-label">Rejection Reason:</label>
                                    <textarea class="form-control mb-2" name="reason" rows="2" required></textarea>
                                    <button type="submit" class="btn btn-danger w-100">
                                        <i class="bi bi-x-circle"></i> Reject
                                    </button>
                                </form>
                            </div>
                        </div>

                        <div class="mt-3">
                            <a href="/section/gatepass/pending" class="btn btn-secondary"><i
                                    class="bi bi-arrow-left"></i> Back</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
