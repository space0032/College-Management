<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Pending for Final Approval</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/section/dashboard"><i class="bi bi-shield-fill-check"></i> Student
                Section</a>
            <div class="navbar-nav ms-auto">
                <a class="btn btn-outline-light btn-sm" href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:replace="~{fragments/navbar :: alerts}"></div>

        <h2><i class="bi bi-list-check"></i> Pending Final Approval (Warden Approved)</h2>

        <div class="card">
            <div class="card-body">
                <div th:if="${gatePasses.empty}" class="text-center py-5">
                    <i class="bi bi-clipboard-check" style="font-size: 4rem; color: #28a745;"></i>
                    <p class="text-muted mt-3">No pending applications. All caught up!</p>
                </div>

                <div th:unless="${gatePasses.empty}" class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>App. No.</th>
                                <th>Student</th>
                                <th>Purpose</th>
                                <th>Warden Approval</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="gp : ${gatePasses}">
                                <td><strong th:text="${gp.applicationNumber}"></strong></td>
                                <td th:text="${gp.student.firstName + ' ' + gp.student.lastName}"></td>
                                <td th:text="${#strings.abbreviate(gp.purpose, 40)}"></td>
                                <td>
                                    <small class="text-success"
                                        th:text="${#temporals.format(gp.wardenApprovalDate, 'dd-MMM HH:mm')}"></small><br>
                                    <small class="text-muted" th:text="${gp.wardenRemarks}"></small>
                                </td>
                                <td>
                                    <a th:href="@{/section/gatepass/{id}(id=${gp.id})}" class="btn btn-sm btn-primary">
                                        <i class="bi bi-eye"></i> Review
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
