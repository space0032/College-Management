<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Security Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/security-gate/dashboard"><i class="bi bi-shield-lock"></i> Gate Security</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text text-white me-3"><i class="bi bi-person"></i> <span
                        th:text="${user.fullName}"></span></span>
                <a class="btn btn-outline-light btn-sm" href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2><i class="bi bi-speedometer2"></i> Security Dashboard</h2>
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <h5><i class="bi bi-check-circle"></i> Approved Passes</h5>
                        <h2 th:text="${approvedCount}">0</h2>
                        <a href="/security-gate/gatepass/approved" class="btn btn-light btn-sm mt-2">View Passes</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
