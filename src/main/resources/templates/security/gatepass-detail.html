<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Verify Gate Pass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/security-gate/dashboard"><i class="bi bi-shield-lock"></i> Gate Security</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card border-success">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0"><i class="bi bi-shield-check"></i> Approved Gate Pass</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-success"><i class="bi bi-check-circle"></i> This pass has been approved
                            by Warden and Student Section</div>

                        <dl class="row">
                            <dt class="col-sm-4">Application Number:</dt>
                            <dd class="col-sm-8">
                                <h5><span class="badge bg-success" th:text="${gatePass.applicationNumber}"></span></h5>
                            </dd>

                            <dt class="col-sm-4">Student:</dt>
                            <dd class="col-sm-8"><strong
                                    th:text="${gatePass.student.firstName + ' ' + gatePass.student.lastName}"></strong>
                            </dd>

                            <dt class="col-sm-4">Roll Number:</dt>
                            <dd class="col-sm-8" th:text="${gatePass.student.rollNumber}"></dd>

                            <dt class="col-sm-4">Purpose:</dt>
                            <dd class="col-sm-8" th:text="${gatePass.purpose}"></dd>

                            <dt class="col-sm-4">Destination:</dt>
                            <dd class="col-sm-8" th:text="${gatePass.destination}"></dd>

                            <dt class="col-sm-4">Out Date:</dt>
                            <dd class="col-sm-8" th:text="${#temporals.format(gatePass.outDate, 'dd-MMM-yyyy')}"></dd>

                            <dt class="col-sm-4">Contact:</dt>
                            <dd class="col-sm-8" th:text="${gatePass.contactNumber}"></dd>
                        </dl>

                        <form th:action="@{/security-gate/gatepass/{id}/mark-used(id=${gatePass.id})}" method="post"
                            class="mt-4">
                            <button type="submit" class="btn btn-success btn-lg w-100"
                                onclick="return confirm('Mark this pass as USED? Student will exit the gate.')">
                                <i class="bi bi-check-circle"></i> Allow Exit & Mark as Used
                            </button>
                        </form>

                        <a href="/security-gate/gatepass/approved" class="btn btn-secondary mt-3"><i
                                class="bi bi-arrow-left"></i> Back</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/d ist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
