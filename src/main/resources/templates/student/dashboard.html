<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - College Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/student/dashboard">
                <i class="bi bi-mortarboard-fill"></i> College Management
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text text-white me-3">
                    <i class="bi bi-person-circle"></i> <span th:text="${user.fullName}"></span>
                </span>
                <a class="btn btn-outline-light btn-sm" href="/logout">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2><i class="bi bi-speedometer2"></i> Student Dashboard</h2>
        <p class="text-muted">Welcome back, <span th:text="${user.fullName}"></span>!</p>

        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card text-white bg-primary mb-3">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-people-fill"></i> Students</h5>
                        <h2 class="card-text" th:text="${studentCount}">0</h2>
                        <a href="/students" class="btn btn-light btn-sm">View All</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-white bg-success mb-3">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-building"></i> Departments</h5>
                        <h2 class="card-text" th:text="${departmentCount}">0</h2>
                        <a href="/departments" class="btn btn-light btn-sm">View All</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-white bg-info mb-3">
                    <div class="card-body">
                        <h5 class="card-title"><i class="bi bi-book-fill"></i> Courses</h5>
                        <h2 class="card-text" th:text="${courseCount}">0</h2>
                        <a href="/courses" class="btn btn-light btn-sm">View All</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="alert alert-info mt-4">
            <h5><i class="bi bi-info-circle-fill"></i> Note</h5>
            <p class="mb-0">The Gate Pass System features are currently under development. You can view and manage
                students, departments, and courses for now.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
