<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Gate Pass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="bi bi-file-earmark-text"></i> Gate Pass Application</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/student/gatepass}" th:object="${gatePass}" method="post">
                            <div class="mb-3">
                                <label for="purpose" class="form-label">Purpose <span
                                        class="text-danger">*</span></label>
                                <textarea class="form-control" th:field="*{purpose}" id="purpose" rows="3"
                                    placeholder="Enter reason for going out (min 10 characters)" required></textarea>
                                <div class="text-danger" th:if="${#fields.hasErrors('purpose')}" th:errors="*{purpose}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="outDate" class="form-label">Out Date <span
                                            class="text-danger">*</span></label>
                                    <input type="date" class="form-control" th:field="*{outDate}" id="outDate" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('outDate')}"
                                        th:errors="*{outDate}"></div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="expectedReturnDate" class="form-label">Expected Return Date <span
                                            class="text-danger">*</span></label>
                                    <input type="date" class="form-control" th:field="*{expectedReturnDate}"
                                        id="expectedReturnDate" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('expectedReturnDate')}"
                                        th:errors="*{expectedReturnDate}"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="destination" class="form-label">Destination <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{destination}" id="destination"
                                    placeholder="Where are you going?" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('destination')}"
                                    th:errors="*{destination}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="contactNumber" class="form-label">Contact Number <span
                                        class="text-danger">*</span></label>
                                <input type="tel" class="form-control" th:field="*{contactNumber}" id="contactNumber"
                                    placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('contactNumber')}"
                                    th:errors="*{contactNumber}"></div>
                                <small class="text-muted">Enter 10-digit mobile number without spaces</small>
                            </div>

                            <div class="alert alert-info">
                                <i class="bi bi-info-circle"></i> <strong>Note:</strong> Your application will be
                                reviewed by the Warden first, then by the Student Section before final approval.
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="/student/dashboard" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-send"></i> Submit Application
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
