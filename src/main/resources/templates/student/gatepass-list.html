<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gate Pass Applications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div th:replace="~{fragments/navbar :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="bi bi-list-ul"></i> My Gate Pass Applications</h2>
            <a href="/student/gatepass/new" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> New Application
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${gatePasses.empty}" class="text-center py-5">
                    <i class="bi bi-inbox" style="font-size: 4rem; color: #ccc;"></i>
                    <p class="text-muted mt-3">No applications yet. Apply for a gate pass to get started.</p>
                    <a href="/student/gatepass/new" class="btn btn-primary">Apply Now</a>
                </div>

                <div th:unless="${gatePasses.empty}" class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>App. No.</th>
                                <th>Purpose</th>
                                <th>Out Date</th>
                                <th>Return Date</th>
                                <th>Status</th>
                                <th>Applied On</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="gp : ${gatePasses}">
                                <td><strong th:text="${gp.applicationNumber}"></strong></td>
                                <td th:text="${#strings.abbreviate(gp.purpose, 30)}"></td>
                                <td th:text="${#temporals.format(gp.outDate, 'dd-MMM-yyyy')}"></td>
                                <td th:text="${#temporals.format(gp.expectedReturnDate, 'dd-MMM-yyyy')}"></td>
                                <td>
                                    <span th:if="${gp.status.name() == 'PENDING'}" class="badge bg-warning text-dark">
                                        <i class="bi bi-clock"></i> Pending
                                    </span>
                                    <span th:if="${gp.status.name() == 'WARDEN_APPROVED'}" class="badge bg-info">
                                        <i class="bi bi-check"></i> Warden Approved
                                    </span>
                                    <span th:if="${gp.status.name() == 'SECTION_APPROVED'}" class="badge bg-success">
                                        <i class="bi bi-check-circle"></i> Approved
                                    </span>
                                    <span th:if="${gp.status.name() == 'REJECTED'}" class="badge bg-danger">
                                        <i class="bi bi-x-circle"></i> Rejected
                                    </span>
                                    <span th:if="${gp.status.name() == 'USED'}" class="badge bg-secondary">
                                        <i class="bi bi-check-all"></i> Used
                                    </span>
                                </td>
                                <td th:text="${#temporals.format(gp.createdAt, 'dd-MMM-yyyy HH:mm')}"></td>
                                <td>
                                    <a th:href="@{/student/gatepass/{id}(id=${gp.id})}"
                                        class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-eye"></i> View
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
