<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/navbar :: head}">
    <title>Student Form</title>
</head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar(activePage='students')}"></nav>

    <div th:replace="~{fragments/navbar :: alerts}"></div>

    <div class="container mt-4">
        <h2><i class="bi bi-person-plus-fill"></i> Student Form</h2>

        <div class="card mt-3">
            <div class="card-body">
                <form th:action="@{/students}" th:object="${student}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">First Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{firstName}"
                            th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}"
                            th:errors="*{firstName}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Last Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{lastName}"
                            th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" th:field="*{email}"
                            th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <select class="form-select" th:field="*{department}">
                            <option value="">-- Select Department --</option>
                            <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}">
                            </option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Save
                        </button>
                        <a href="/students" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
</body>

</html>
