<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/navbar :: head}">
    <title>Students</title>
</head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar(activePage='students')}"></nav>

    <div th:replace="~{fragments/navbar :: alerts}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="bi bi-people-fill"></i> Students</h2>
            <a href="/students/new" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Add Student
            </a>
        </div>

        <div th:if="${students.isEmpty()}" class="alert alert-info">
            <i class="bi bi-info-circle"></i> No students found. Click "Add Student" to create one.
        </div>

        <table th:unless="${students.isEmpty()}" class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.id}"></td>
                    <td th:text="${student.firstName}"></td>
                    <td th:text="${student.lastName}"></td>
                    <td th:text="${student.email}"></td>
                    <td th:text="${student.department != null ? student.department.name : 'N/A'}"></td>
                    <td>
                        <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <form th:action="@{/students/delete/{id}(id=${student.id})}" method="post"
                            style="display: inline;"
                            onsubmit="return confirmDelete('Are you sure you want to delete this student?');">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
</body>

</html>
