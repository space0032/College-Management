<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${user.id != null ? 'Edit User' : 'Add User'}">User Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-person-gear"></i>
                            <span th:text="${user.id != null ? 'Edit User' : 'Add New User'}"></span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                        <form th:action="${user.id != null ? '/users/' + user.id : '/users'}" th:object="${user}"
                            method="post">

                            <div class="mb-3">
                                <label for="username" class="form-label">Username <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{username}" id="username"
                                    placeholder="e.g., john.doe" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('username')}"
                                    th:errors="*{username}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{fullName}" id="fullName"
                                    placeholder="e.g., John Doe" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('fullName')}"
                                    th:errors="*{fullName}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" th:field="*{email}" id="email"
                                    placeholder="e.g., john@college.edu" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="role" class="form-label">Role <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{role}" id="role" required>
                                    <option value="">-- Select Role --</option>
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">
                                    </option>
                                </select>
                                <small class="text-muted">
                                    STUDENT | WARDEN | STUDENT_SECTION (Admin) | SECURITY
                                </small>
                            </div>

                            <div class="mb-3">
                                <label for="rawPassword" class="form-label">
                                    Password <span th:if="${user.id == null}" class="text-danger">*</span>
                                    <span th:if="${user.id != null}" class="text-muted">(Leave blank to keep
                                        current)</span>
                                </label>
                                <input type="password" class="form-control" id="rawPassword" name="rawPassword"
                                    placeholder="Enter password" th:required="${user.id == null}">
                                <small class="text-muted">Minimum 6 characters</small>
                            </div>

                            <div class="form-check mb-3" th:if="${user.id != null}">
                                <input class="form-check-input" type="checkbox" th:field="*{enabled}" id="enabled">
                                <label class="form-check-label" for="enabled">
                                    Account Enabled
                                </label>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="/users" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i>
                                    <span th:text="${user.id != null ? 'Update' : 'Create'}"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
