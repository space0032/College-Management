<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div th:replace="~{fragments/navbar :: alerts}"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="bi bi-person-gear"></i> User Management</h2>
            <a href="/users/new" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Add New User
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${users.empty}" class="text-center py-5">
                    <i class="bi bi-people" style="font-size: 4rem; color: #ccc;"></i>
                    <p class="text-muted mt-3">No users found.</p>
                </div>

                <div th:unless="${users.empty}" class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Username</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td><strong th:text="${user.username}"></strong></td>
                                <td th:text="${user.fullName}"></td>
                                <td th:text="${user.email}"></td>
                                <td>
                                    <span class="badge"
                                        th:classappend="${user.role.name() == 'STUDENT' ? 'bg-primary' : 
                                                          user.role.name() == 'WARDEN' ? 'bg-success' : 
                                                          user.role.name() == 'STUDENT_SECTION' ? 'bg-warning text-dark' : 'bg-dark'}"
                                        th:text="${user.role}"></span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${user.enabled ? 'bg-success' : 'bg-secondary'}"
                                        th:text="${user.enabled ? 'Active' : 'Disabled'}"></span>
                                </td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/users/{id}/edit(id=${user.id})}"
                                            class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{/users/{id}/toggle-status(id=${user.id})}" method="post"
                                            style="display:inline;">
                                            <button type="submit" class="btn btn-sm btn-outline-warning"
                                                th:title="${user.enabled ? 'Disable' : 'Enable'}">
                                                <i class="bi"
                                                    th:classappend="${user.enabled ? 'bi-pause-circle' : 'bi-play-circle'}"></i>
                                            </button>
                                        </form>
                                        <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post"
                                            style="display:inline;" onsubmit="return confirm('Delete this user?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
