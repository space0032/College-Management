<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Warden Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="/warden/dashboard">
                <i class="bi bi-shield-check"></i> Warden Panel
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text text-white me-3">
                    <i class="bi bi-person-badge"></i> <span th:text="${user.fullName}"></span>
                </span>
                <a class="btn btn-outline-light btn-sm" href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2><i class="bi bi-speedometer2"></i> Warden Dashboard</h2>
        <p class="text-muted">Hostel: <strong th:text="${hostel != null ? hostel.name : 'Not Assigned'}"></strong></p>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card bg-warning text-white">
                    <div class="card-body">
                        <h5><i class="bi bi-hourglass-split"></i> Pending Approvals</h5>
                        <h2 th:text="${pendingCount}">0</h2>
                        <a href="/warden/gatepass/pending" class="btn btn-light btn-sm mt-2">Review Now</a>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card bg-info text-white">
                    <div class="card-body">
                        <h5><i class="bi bi-building"></i> My Hostel</h5>
                        <p th:text="${hostel != null ? hostel.name : 'Not Assigned'}">-</p>
                        <small th:if="${hostel != null}" th:text="'Capacity: ' + ${hostel.capacity}"></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
