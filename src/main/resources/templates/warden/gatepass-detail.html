<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Review Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="/warden/dashboard"><i class="bi bi-shield-check"></i> Warden Panel</a>
            <div class="navbar-nav ms-auto">
                <a class="btn btn-outline-light btn-sm" href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-warning">
                        <h4 class="mb-0"><i class="bi bi-file-earmark-text"></i> Gate Pass Application Review</h4>
                    </div>
                    <div class="card-body">
                        <dl class="row">
                            <dt class="col-sm-4">Application Number:</dt>
                            <dd class="col-sm-8"><strong th:text="${gatePass.applicationNumber}"></strong></dd>

                            <dt class="col-sm-4">Student:</dt>
                            <dd class="col-sm-8"
                                th:text="${gatePass.student.firstName + ' ' + gatePass.student.lastName}"></dd>

                            <dt class="col-sm-4">Roll Number:</dt>
                            <dd class="col-sm-8" th:text="${gatePass.student.rollNumber}"></dd>

                            <dt class="col-sm-4">Purpose:</dt>
                            <dd class="col-sm-8" th:text="${gatePass.purpose}"></dd>

                            <dt class="col-sm-4">Out Date:</dt>
                            <dd class="col-sm-8" th:text="${#temporals.format(gatePass.outDate, 'dd-MMM-yyyy')}"></dd>

                            <dt class="col-sm-4">Expected Return:</dt>
                            <dd class="col-sm-8"
                                th:text="${#temporals.format(gatePass.expectedReturnDate, 'dd-MMM-yyyy')}"></dd>

                            <dt class="col-sm-4">Destination:</dt>
                            <dd class="col-sm-8" th:text="${gatePass.destination}"></dd>

                            <dt class="col-sm-4">Contact Number:</dt>
                            <dd class="col-sm-8" th:text="${gatePass.contactNumber}"></dd>

                            <dt class="col-sm-4">Applied On:</dt>
                            <dd class="col-sm-8"
                                th:text="${#temporals.format(gatePass.createdAt, 'dd-MMM-yyyy HH:mm')}"></dd>
                        </dl>

                        <hr>

                        <div class="row">
                            <div class="col-md-6">
                                <form th:action="@{/warden/gatepass/{id}/approve(id=${gatePass.id})}" method="post">
                                    <label class="form-label">Remarks (Optional):</label>
                                    <textarea class="form-control mb-2" name="remarks" rows="2"
                                        placeholder="Add any comments..."></textarea>
                                    <button type="submit" class="btn btn-success w-100">
                                        <i class="bi bi-check-circle"></i> Approve
                                    </button>
                                </form>
                            </div>
                            <div class="col-md-6">
                                <form th:action="@{/warden/gatepass/{id}/reject(id=${gatePass.id})}" method="post">
                                    <label class="form-label">Rejection Reason:</label>
                                    <textarea class="form-control mb-2" name="reason" rows="2"
                                        placeholder="Why rejecting?" required></textarea>
                                    <button type="submit" class="btn btn-danger w-100">
                                        <i class="bi bi-x-circle"></i> Reject
                                    </button>
                                </form>
                            </div>
                        </div>

                        <div class="mt-3">
                            <a href="/warden/gatepass/pending" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Back to List
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
